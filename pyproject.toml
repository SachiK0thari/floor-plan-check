[project]
name = "plancheck"
version = "0.1.0"
description = "Floor plan to structured building model, plus accessibility and building code checks. Design-assist tool, not a code review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "shapely>=2.1",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "ezdxf>=1.3",
    "trimesh>=4.4",
    "mapbox-earcut>=1.0",
    "pillow>=10.1",
    "ifcopenshell>=0.9.0.post1",
    "truststore>=0.10.5",
    "pypdf>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plancheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
packages = ["plancheck", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["shapely.*", "trimesh.*", "networkx.*", "mapbox_earcut.*"]
ignore_missing_imports = true
follow_untyped_imports = false
